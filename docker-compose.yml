services:
  redis:
    image: redis:8-alpine
    container_name: careerTracka-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - careerTracka-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: careerTracka-redis-insight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - careerTracka-network

volumes:
  redis_data:
  redis_insight_data:

networks:
  careerTracka-network:
    driver: bridge